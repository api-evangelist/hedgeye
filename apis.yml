name: Hedgeye
description: >-
  Hedgeye Risk Management is an independent investment-research and financial-media firm founded in
  2008 by Keith McCullough and headquartered in Stamford, Connecticut. Hedgeye sells subscription
  research and market analysis to investors across macroeconomics, sector/vertical coverage, and
  individual securities, delivered through daily notes, models, and its Hedgeye TV video platform,
  newsletters, and live events. The company is best known for its data-driven, process-oriented
  "GIP" (growth, inflation, policy) macro framework and its independent, no-conflicts positioning
  relative to traditional Wall Street sell-side research. As surfaced in the API Evangelist network,
  Hedgeye operates a consumer/subscriber web application at app.hedgeye.com but does not publish a
  public developer program, API, SDK, or machine-readable discovery surface; this profile captures
  the identity and domain-security posture that could be verified without authenticated access.
